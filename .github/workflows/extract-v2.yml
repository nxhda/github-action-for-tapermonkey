name: extract-tapermonkey-scripts-v2

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Input zip/tar file path"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show working directory
        run: |
          pwd
          find . -not -path './.git*' -print

      - name: Show input path
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: echo "The input path is: [$INPUT_PATH]"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install leveldb

      - name: Extract Tampermonkey scripts
        env:
          INPUT_PATH: ${{ inputs.path }}
        run: python py-2.py "$INPUT_PATH"

      - name: Show extraction output
        if: always()
        run: |
          find . -not -path './.git*' -print
          if [ -f github-action-run.log ]; then
            cat github-action-run.log
          fi

      - name: Upload extracted scripts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-tampermonkey-extract-output
          path: |
            extract_tampermonkey_script_output/
            github-action-run.log
          if-no-files-found: warn

      - name: Finished
        run: echo "finished"
